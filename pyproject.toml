[project]
name = "devpipe"
version = "0.1.0"
description = "Organize feature development pipelines run by AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
devpipe = "devpipe.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
