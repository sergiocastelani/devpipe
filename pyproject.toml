[project]
name = "devpipe"
version = "0.1.0"
description = "Organize feature development pipelines run by AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
devpipe = "devpipe.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
# Test folders mirror the layers; importlib mode lets test files share
# basenames across folders without __init__.py files.
addopts = "--import-mode=importlib"

# Layer rules (docs/architecture.md). Check with: uv run lint-imports
[tool.importlinter]
root_packages = ["devpipe"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: app -> views -> services -> persistence -> models"
type = "layers"
layers = [
    "devpipe.__main__",
    "devpipe.app",
    "devpipe.views",
    "devpipe.services",
    "devpipe.persistence",
    "devpipe.models",
]

[[tool.importlinter.contracts]]
name = "Views go through services, never persistence"
type = "forbidden"
source_modules = ["devpipe.views"]
forbidden_modules = ["devpipe.persistence"]

[[tool.importlinter.contracts]]
name = "Only views and app use Qt"
type = "forbidden"
source_modules = ["devpipe.services", "devpipe.persistence", "devpipe.models"]
forbidden_modules = ["PySide6"]
